id: sangfor-ssl-vpn
info:
  name: 深信服SSL VPN
  author: P0m32Kun
  tags: detect,tech,sangfor-ssl-vpn
  severity: info
  metadata:
    product: sangfor-ssl-vpn
    vendor: 00_unknown
    verified: false
  description: 深信服 SSL VPN 是国内主流的企业远程接入网关。
  reference:
  - https://www.sangfor.com.cn
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - <title>[^<]*(?:深信服|SANGFOR|Sangfor)[^<]*SSL[^<]*</title>
    - /por/login_psw\.csp
    - SANGFOR\.Login
    - /svpn_html/login\.html
    - Sangfor SSL VPN
    - /por/
    - sangfor\.js
    case-insensitive: true
  - type: regex
    part: server
    regex:
    - Sangfor
    case-insensitive: true
