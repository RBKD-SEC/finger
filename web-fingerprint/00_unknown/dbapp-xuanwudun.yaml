id: dbapp-xuanwudun
info:
  name: 安恒玄武盾
  author: P0m32Kun
  tags: detect,tech,dbapp-xuanwudun
  severity: info
  metadata:
    product: dbapp-xuanwudun
    vendor: 00_unknown
    verified: false
  description: 安恒信息 玄武盾 云防御。
  reference:
  - https://www.dbappsecurity.com.cn
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - <title>[^<]*玄武盾[^<]*</title>
    - 玄武盾
    - xuanwudun
    case-insensitive: true
