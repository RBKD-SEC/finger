id: sangfor-edr
info:
  name: 深信服EDR
  author: P0m32Kun
  tags: detect,tech,sangfor-edr
  severity: info
  metadata:
    product: sangfor-edr
    vendor: 00_unknown
    verified: false
  description: 深信服 EDR 终端检测响应平台。
  reference:
  - https://www.sangfor.com.cn
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - <title>[^<]*EDR[^<]*</title>
    - <title>[^<]*终端检测响应平台[^<]*</title>
    - Sangfor EDR
    - /tool/log/c\.php
    case-insensitive: true
