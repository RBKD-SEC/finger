id: 74cms
info:
  name: 74CMS
  author: P0m32Kun
  tags: detect,tech,74cms
  severity: info
  metadata:
    product: 74cms
    vendor: 00_unknown
    verified: false
  description: 齐博 74CMS 是国内常见的 PHP 人才招聘系统。
  reference:
  - https://www.74cms.com
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - Powered by <a [^>]*74cms[^>]*>74CMS</a>
    - /74cms/templates/
    - <title>[^<]*74cms[^<]*</title>
    case-insensitive: true
