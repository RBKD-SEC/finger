id: sangfor-af
info:
  name: 深信服AF
  author: P0m32Kun
  tags: detect,tech,sangfor-af
  severity: info
  metadata:
    product: sangfor-af
    vendor: 00_unknown
    verified: false
  description: 深信服 AF（下一代应用防火墙 NGAF）。
  reference:
  - https://www.sangfor.com.cn
http:
- method: GET
  path:
  - '{{BaseURL}}/'
  matchers:
  - type: regex
    regex:
    - <title>[^<]*SANGFOR(?:[^<]* )?(?:AF|NGAF)[^<]*</title>
    - <title>[^<]*下一代防火墙[^<]*SANGFOR[^<]*</title>
    - /dlogin\.php\?nodeid
    case-insensitive: true
