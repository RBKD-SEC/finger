id: wordpress-zh-tw
info:
  name: WordPress繁体中文
  author: P0m32Kun
  tags: detect,tech,wordpress-zh-tw
  severity: info
  metadata:
    product: wordpress-zh-tw
    vendor: 00_unknown
    verified: false
  description: WordPress 中文化插件 / 主题特征。
