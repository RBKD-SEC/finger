id: knife4j
info:
  name: knife4j
  author: P0m32Kun
  tags: detect,tech,knife4j
  severity: info
  metadata:
    product: knife4j
    vendor: 00_unknown
    verified: true
  description: knife4j 是基于 Swagger 的增强型 API 文档框架，入口固定为 /doc.html。
http:
- method: GET
  path:
  - '{{BaseURL}}/doc.html'
  matchers:
  - type: word
    words:
    - knife4j
    - SwaggerBootstrapUi
    condition: or
    case-insensitive: true
